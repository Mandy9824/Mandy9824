<section class="rmk-cookie" data-rmk-cookie role="region" aria-labelledby="ck-t" hidden>
  <div data-view="main" style="display: flex; flex-direction: column; gap: 1rem">
    <h2 id="ck-t">Cookies op robotmaaierkompas.nl</h2>
    <p class="rmk-small" style="color: var(--rmk-text)">We gebruiken noodzakelijke cookies om de site te laten werken. Met jouw toestemming meten we ook anoniem bezoek en zien winkels dat je via ons kwam. <a href="/cookies/">Cookieverklaring</a></p>
    <div class="rmk-cookie__actions">
      <button type="button" class="rmk-btn rmk-btn--secondary" data-action="reject">Alles weigeren</button>
      <button type="button" class="rmk-btn rmk-btn--primary" data-action="accept">Alles accepteren</button>
      <button type="button" class="rmk-btn rmk-btn--quiet" data-action="settings">Zelf kiezen</button>
    </div>
  </div>
  <div data-view="settings" hidden style="display: flex; flex-direction: column; gap: 1rem">
    <h2>Kies welke cookies je toestaat</h2>
    <div class="rmk-cookie__opts">
      <label class="rmk-switch"><span><b>Noodzakelijk</b></span><input type="checkbox" checked disabled><small>Altijd aan. Onthoudt bijvoorbeeld deze keuze.</small></label>
      <label class="rmk-switch"><span><b>Statistiek</b></span><input type="checkbox" name="stats"><small>Anoniem bezoek meten om pagina's te verbeteren.</small></label>
      <label class="rmk-switch"><span><b>Affiliate</b></span><input type="checkbox" name="aff"><small>Winkels zien dat je via ons kwam. Prijzen veranderen niet.</small></label>
    </div>
    <div class="rmk-cookie__actions">
      <button type="button" class="rmk-btn rmk-btn--secondary" data-action="reject">Alles weigeren</button>
      <button type="button" class="rmk-btn rmk-btn--primary" data-action="save">Keuze opslaan</button>
    </div>
  </div>
</section>
