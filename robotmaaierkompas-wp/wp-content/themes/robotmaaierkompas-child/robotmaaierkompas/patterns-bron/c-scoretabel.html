<div class="rmk-tablewrap">
  <table class="rmk-table rmk-table--cards">
    <caption>Scores volgens scoremodel v1.0 (concept tot bevriezing). "Prijs vanaf" is de laagste prijs uit de productbox; bron en datum staan daar.</caption>
    <thead><tr><th scope="col">#</th><th scope="col">Model</th><th scope="col">Beste voor</th><th scope="col" class="is-num">Score</th><th scope="col" class="is-num">Prijs vanaf</th><th scope="col"><span class="rmk-sr">Details</span></th></tr></thead>
    <tbody>
      <!-- Eén rij per model. De score wordt berekend uit data-scores (zelfde waarden als in het scoreblok). -->
      <tr><td class="c-rank"><span class="rmk-ranknum">[#]</span></td><th scope="row" class="c-model">[Modelnaam]</th><td class="c-best">[beste voor]</td><td class="is-num c-score">{{MINIS}}</td><td class="is-num c-price" data-label="Prijs vanaf">€ [prijs]</td><td class="c-go"><a href="#p-[model-slug]">Details</a></td></tr>
      <tr><td class="c-rank"><span class="rmk-ranknum">[#]</span></td><th scope="row" class="c-model">[Modelnaam]</th><td class="c-best">[beste voor]</td><td class="is-num c-score">{{MINIS}}</td><td class="is-num c-price" data-label="Prijs vanaf"><span class="rmk-small">bij de winkel</span></td><td class="c-go"><a href="#p-[model-slug]">Details</a></td></tr>
    </tbody>
  </table>
</div>
