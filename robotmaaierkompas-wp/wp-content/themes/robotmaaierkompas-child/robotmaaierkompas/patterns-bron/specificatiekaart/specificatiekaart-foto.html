<!-- Ontbrekende waarde: vervang de hele chip door de "is-missing"-variant:
     <div class="rmk-spec rmk-spec--geluid is-missing"><dt>Geluid</dt><dd><span aria-hidden="true">–</span><span class="rmk-sr">onbekend</span></dd></div> -->
<div class="rmk-speccard rmk-speccard--photo">
  <figure class="rmk-speccard__figure">
    <div class="rmk-speccard__visual">
      <img src="[url productfoto]" alt="[Merk] [Modelnaam], productfoto" width="800" height="600" loading="lazy" decoding="async">
    </div>
    <figcaption class="rmk-speccard__caption">Foto: fabrikant</figcaption>
  </figure>
  <dl class="rmk-speccard__specs" aria-label="Belangrijkste kenmerken">
    <div class="rmk-spec rmk-spec--oppervlak"><dt>Oppervlak</dt><dd>[m²] m²</dd></div>
    <div class="rmk-spec rmk-spec--helling"><dt>Helling</dt><dd>[%]%</dd></div>
    <div class="rmk-spec rmk-spec--navigatie"><dt>Navigatie</dt><dd>[RTK | camera | LiDAR | draad]</dd></div>
    <div class="rmk-spec rmk-spec--geluid"><dt>Geluid</dt><dd>[dB] dB</dd></div>
    <div class="rmk-spec rmk-spec--verbinding"><dt>Verbinding</dt><dd>[4G | module | geen]</dd></div>
  </dl>
</div>
