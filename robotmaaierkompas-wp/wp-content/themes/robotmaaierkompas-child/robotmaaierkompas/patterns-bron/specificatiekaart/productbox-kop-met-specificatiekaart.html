<!-- Vervangt <div class="rmk-product__head"> in productbox.php en productbox-zonder-prijs.php.
     De naam in het beeldvlak is aria-hidden: de h3 is de echte kop. Met foto: gebruik specificatiekaart-foto.html. -->
<div class="rmk-product__head">
<div class="rmk-speccard">
  <figure class="rmk-speccard__figure">
    <div class="rmk-speccard__visual" aria-hidden="true">
      <p class="rmk-speccard__brand">[Merk]</p>
      <p class="rmk-speccard__model">[Modelnaam]</p>
    </div>
    <figcaption class="rmk-speccard__caption">Geen productfoto beschikbaar</figcaption>
  </figure>
  <dl class="rmk-speccard__specs" aria-label="Belangrijkste kenmerken">
    <div class="rmk-spec rmk-spec--oppervlak"><dt>Oppervlak</dt><dd>[m²] m²</dd></div>
    <div class="rmk-spec rmk-spec--helling"><dt>Helling</dt><dd>[%]%</dd></div>
    <div class="rmk-spec rmk-spec--navigatie"><dt>Navigatie</dt><dd>[RTK | camera | LiDAR | draad]</dd></div>
    <div class="rmk-spec rmk-spec--geluid"><dt>Geluid</dt><dd>[dB] dB</dd></div>
    <div class="rmk-spec rmk-spec--verbinding"><dt>Verbinding</dt><dd>[4G | module | geen]</dd></div>
  </dl>
</div>
  <div class="rmk-product__title">
    <span class="rmk-rank">[positie] · [categorie]</span>
    <h3 id="p-[model-slug]">[Merk] [Modelnaam]</h3>
    <p class="rmk-bestfor"><span>Beste voor</span><b>[beste voor]</b></p>
  </div>
</div>
